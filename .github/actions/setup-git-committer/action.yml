name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  # kilocode_change start
  kilo-maintainer-app-id:
    description: "Kilo Maintainer GitHub App ID"
    # fork: optional. Without an App, release commits are pushed with the job's GITHUB_TOKEN as
    # github-actions[bot], which branch protection on main must allow.
    required: false
    default: ""
  kilo-maintainer-app-secret:
    description: "Kilo Maintainer GitHub App private key"
    required: false
    default: ""
  # kilocode_change end
outputs:
  token:
    description: "GitHub App token"
    value: ${{ steps.committer.outputs.token }} # kilocode_change
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.committer.outputs.app-slug }} # kilocode_change
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: inputs['kilo-maintainer-app-id'] != '' # kilocode_change
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        # kilocode_change start
        app-id: ${{ inputs['kilo-maintainer-app-id'] }}
        private-key: ${{ inputs['kilo-maintainer-app-secret'] }}
        # kilocode_change end
        owner: ${{ github.repository_owner }}

    # kilocode_change start - fork: without an App, the job's token, as github-actions[bot]
    - name: Resolve committer
      id: committer
      run: |
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        echo "app-slug=$SLUG" >> "$GITHUB_OUTPUT"
      env:
        TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
        SLUG: ${{ steps.apptoken.outputs.app-slug || 'github-actions' }}
      shell: bash
    # kilocode_change end

    - name: Configure git user
      run: |
        slug="${{ steps.committer.outputs.app-slug }}" # kilocode_change
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
        # kilocode_change start
        keys="$(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)"
        for key in $keys; do
          path="$(git config --local --get "$key" || true)"
          case "$path" in
            *git-credentials-*.config) git config --local --unset-all "$key" || true ;;
          esac
        done
        # kilocode_change end
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.committer.outputs.token }}@github.com/${{ github.repository }} # kilocode_change
      shell: bash
