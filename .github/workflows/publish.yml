name: publish
run-name: "${{ format('{0} {1}', inputs.pre_release && 'pre-release' || 'release', inputs.bump) }}"

on:
  # push:
  #   branches:
  #     - ci
  #     - dev
  #     - beta
  #     - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional)"
        required: false
        type: string
      # kilocode_change start
      pre_release:
        description: "Publish as pre-release (VS Code marketplace + npm rc channel)"
        required: false
        type: boolean
        default: true
      # kilocode_change end

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  issues: write # kilocode_change - label automated JetBrains CLI pin bump PRs
  packages: write
  pull-requests: write # kilocode_change - create automated JetBrains CLI pin bump PRs

jobs:
  version:
    runs-on: ubuntu-24.04 # kilocode_change - fork: GitHub-hosted runners; this fork cannot use Kilo's Blacksmith runners
    if: github.repository == 'sreent/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # kilocode_change start - install deps for version script workspace resolution
      - name: Install dependencies
        run: bun install
      # kilocode_change end

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KILO_BUMP: ${{ inputs.bump }}
          KILO_VERSION: ${{ inputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: ubuntu-24.04 # kilocode_change - fork: GitHub-hosted runners; this fork cannot use Kilo's Blacksmith runners
    if: github.repository == 'sreent/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-sbom # kilocode_change

      # kilocode_change start - block trusted bad chains, warn when live endpoints are unavailable
      - name: Verify Bun certificate revocation
        run: bun script/kilocode/bun-probe.ts --allow-unavailable
      # kilocode_change end

      # kilocode_change start
      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      # kilocode_change end
      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SBOM_ENFORCE: ${{ vars.SBOM_ENFORCE }} # kilocode_change

      # kilocode_change start - CRA evidence. The build already generated and
      # uploaded a sidecar per archive; this re-checks the published set and
      # exports the attestation subjects so signing never guesses a digest.
      - name: Verify CLI SBOM evidence
        id: sbom
        if: needs.version.outputs.release != ''
        run: |
          bun run script/kilocode/sbom.ts verify --manifest "$MANIFEST" --dir packages/opencode/dist
          bun run script/kilocode/sbom.ts matrix --manifest "$MANIFEST" --output subjects
        env:
          MANIFEST: packages/opencode/dist/cli-sbom-evidence.json
          SBOM_ENFORCE: ${{ vars.SBOM_ENFORCE }}

      - name: Upload CLI SBOM evidence
        if: needs.version.outputs.release != ''
        uses: actions/upload-artifact@v7
        with:
          name: kilo-cli-sboms
          path: |
            packages/opencode/dist/*.cdx.json
            packages/opencode/dist/cli-sbom-evidence.json
            packages/opencode/dist/tucode-cli-SHA256SUMS
          if-no-files-found: error
      # kilocode_change end

      # kilocode_change start - pack dist tree into a single zstd-compressed tar before upload.
      # download-artifact@v4's streaming unzip is CPU-bound and processes entries one by one;
      # collapsing ~480 files into one tar cuts build-vscode download from >30m to seconds.
      # zstd compresses the wasms (~4x) and leaves the already-compact binaries alone, for
      # ~1 GB artifact. upload-artifact@v7's `archive: false` skips the zip wrapper entirely
      # so the tarball travels as-is (download-artifact@v8 auto-detects via Content-Type).
      # With `archive: false` the `name:` input is ignored; the artifact is named after the
      # file (kilo-cli.tar.zst). zstd + GNU tar are preinstalled on both github-hosted and
      # blacksmith ubuntu-2404. See actions/upload-artifact#36, actions/toolkit#1533.
      - name: Pack CLI dist into tar.zst
        run: |
          find packages/opencode/dist -name '*.map' -delete
          tar --zstd -cf /tmp/kilo-cli.tar.zst -C packages/opencode/dist .

      - uses: actions/upload-artifact@v7
        with:
          path: /tmp/kilo-cli.tar.zst
          archive: false
      # kilocode_change end

    outputs:
      version: ${{ needs.version.outputs.version }}
      sbom-subjects: ${{ steps.sbom.outputs.subjects }} # kilocode_change

  # kilocode_change start - bind each published CLI archive to its SBOM with a
  # signed attestation. Runs off the small sidecar artifact rather than the ~1 GB
  # CLI build artifact, since attestation needs the digest, not the bytes.
  attest-cli:
    name: Attest CLI SBOM (${{ matrix.artifact }})
    needs: build-cli
    if: needs.build-cli.outputs.sbom-subjects != '' && fromJSON(needs.build-cli.outputs.sbom-subjects).include[0] != null
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.SBOM_ENFORCE != 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-cli.outputs.sbom-subjects) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli-sboms
          path: sboms

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.artifact }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sboms/${{ matrix.sbom }}
  # kilocode_change end

  # kilocode_change start - execute supported Unix CLI binaries before packaging VSIX artifacts
  validate-cli-unix:
    name: Validate CLI (${{ matrix.target }})
    needs: pack-signed-cli
    if: ${{ !cancelled() && needs.pack-signed-cli.result == 'success' }} # kilocode_change - fork: with or without Windows signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            uname: arm64
            package: "@tucode/cli-darwin-arm64"
            mode: host
          - target: darwin-x64
            runner: macos-15-intel
            uname: x86_64
            package: "@tucode/cli-darwin-x64"
            mode: host
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@tucode/cli-linux-arm64"
            mode: host
          - target: linux-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@tucode/cli-linux-x64"
            mode: host
          - target: alpine-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@tucode/cli-linux-arm64-musl"
            mode: alpine
            platform: linux/arm64
          - target: alpine-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@tucode/cli-linux-x64-musl"
            mode: alpine
            platform: linux/amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli-signed.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p dist
          tar --zstd -xf /tmp/kilo-cli-signed.tar.zst -C dist

      - name: Run CLI smoke test
        run: |
          test "$(uname -m)" = "${{ matrix.uname }}"

          smoke_host() {
            binary="$1"
            "$binary" --version
            helper="$(dirname "$binary")/bwrap"
            if [[ "${{ matrix.target }}" == linux-* ]]; then
              test -x "$helper"
              grep -q '^SPDX-License-Identifier: LGPL-2.0-or-later$' "$(dirname "$binary")/licenses/bubblewrap/NOTICE"
              "$helper" --version
              # The live user-namespace bootstrap depends on the runner's kernel/AppArmor policy
              # (GitHub-hosted Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1), not on
              # the shipped artifact. The runtime probe degrades gracefully, so keep this check non-fatal.
              "$helper" --unshare-user --disable-userns --unshare-pid --die-with-parent --new-session \
                --ro-bind / / --dev /dev --proc /proc -- "$helper" --version \
                || echo "unprivileged user namespaces unavailable on this runner; skipping live sandbox check"
            fi
            root="$(mktemp -d)"
            trap 'rm -rf "$root"' RETURN
            (
              unset KILO_MODELS_PATH KILO_MODELS_URL KILO_CONFIG KILO_CONFIG_DIR
              export XDG_DATA_HOME="$root/data"
              export XDG_CACHE_HOME="$root/cache"
              export XDG_CONFIG_HOME="$root/config"
              export XDG_STATE_HOME="$root/state"
              export KILO_PTY_SMOKE=1 # kilocode_change
              export KILO_DISABLE_MODELS_FETCH=1
              export KILO_DISABLE_PROJECT_CONFIG=1
              export KILO_CONFIG_CONTENT='{"enabled_providers":["anthropic"]}'
              export ANTHROPIC_API_KEY=dummy
              "$binary" --pure __pty-smoke # kilocode_change
              "$binary" --pure models anthropic | grep -q '^anthropic/'
            )
          }

          if [ "${{ matrix.mode }}" = "host" ]; then
            smoke_host "./dist/${{ matrix.package }}/bin/tucode"
            exit 0
          fi

          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD/dist:/dist:ro" \
            -e PACKAGE="${{ matrix.package }}" \
            alpine:3.22 \
            sh -c '
              set -eu
              # kilocode_change start - Bun musl binaries link against libstdc++ and libgcc_s
              # (GCC C++ runtime). Alpine does not ship these by default; they are available
              # as optional packages and must be installed for any Bun-compiled musl binary to run.
              apk add --no-cache libstdc++ libgcc
              # kilocode_change end
              binary="/dist/$PACKAGE/bin/tucode" # kilocode_change
              "$binary" --version # kilocode_change
              "/dist/$PACKAGE/bin/bwrap" --version # kilocode_change
              grep -q '\''^SPDX-License-Identifier: LGPL-2.0-or-later$'\'' "/dist/$PACKAGE/bin/licenses/bubblewrap/NOTICE" # kilocode_change
              root="$(mktemp -d)"
              trap '\''rm -rf "$root"'\'' EXIT
              unset KILO_MODELS_PATH KILO_MODELS_URL KILO_CONFIG KILO_CONFIG_DIR
              export XDG_DATA_HOME="$root/data"
              export XDG_CACHE_HOME="$root/cache"
              export XDG_CONFIG_HOME="$root/config"
              export XDG_STATE_HOME="$root/state"
              export KILO_DISABLE_MODELS_FETCH=1
              export KILO_DISABLE_PROJECT_CONFIG=1
              export KILO_CONFIG_CONTENT='\''{"enabled_providers":["anthropic"]}'\''
              export ANTHROPIC_API_KEY=dummy
              "$binary" --pure models anthropic | grep -q "^anthropic/"
            '

  validate-cli-windows:
    name: Validate CLI (windows-${{ matrix.arch }})
    needs: pack-signed-cli # kilocode_change
    if: ${{ !cancelled() && needs.pack-signed-cli.result == 'success' }} # kilocode_change - fork: with or without Windows signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20 # kilocode_change
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            package: "@tucode/cli-windows-arm64"
          - arch: x64
            runner: windows-2025
            package: "@tucode/cli-windows-x64"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli-signed.tar.zst # kilocode_change
          path: ${{ runner.temp }}
          skip-decompress: true

      - name: Install zstd
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstandard -y --no-progress
          }

      - name: Unpack CLI dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          zstd -d --stdout "$env:RUNNER_TEMP\kilo-cli-signed.tar.zst" | tar -xf - -C dist # kilocode_change

      - name: Run CLI smoke test
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}".Replace("/", "\")
          $binary = ".\dist\$package\bin\tucode.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          try {
            foreach ($name in "KILO_MODELS_PATH", "KILO_MODELS_URL", "KILO_CONFIG", "KILO_CONFIG_DIR") {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            $env:XDG_DATA_HOME = Join-Path $root "data"
            $env:XDG_CACHE_HOME = Join-Path $root "cache"
            $env:XDG_CONFIG_HOME = Join-Path $root "config"
            $env:XDG_STATE_HOME = Join-Path $root "state"
            $env:KILO_DISABLE_MODELS_FETCH = "1"
            $env:KILO_DISABLE_PROJECT_CONFIG = "1"
            $env:KILO_CONFIG_CONTENT = '{"enabled_providers":["anthropic"]}'
            $env:ANTHROPIC_API_KEY = "dummy"
            if ("${{ matrix.arch }}" -eq "x64") {
              $env:KILO_PTY_SMOKE = "1"
              & $binary --pure __pty-smoke
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $output = & $binary --pure models anthropic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($output -match "(?m)^anthropic/")) {
              throw "Compiled Windows binary did not list Anthropic models from the embedded snapshot"
            }
          } finally {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }
  # kilocode_change end
  # kilocode_change start - EV-sign Windows binaries via Azure Key Vault.
  # AzureSignTool is Windows-only, so signing runs on a Windows runner between
  # build-cli and its consumers. Artifacts are immutable, so pack-signed-cli
  # merges the signed exes into the build-cli dist and re-uploads it as
  # kilo-cli-signed.tar.zst; all downstream jobs use that.
  sign-cli-windows:
    name: Sign CLI (Windows EV)
    needs: build-cli
    runs-on: windows-2025
    # Signing needs the repository's own Azure Key Vault certificate, so it runs once the
    # WINDOWS_SIGNING variable is "true". Without it, the Windows binaries ship unsigned.
    if: github.repository == 'sreent/kilocode' && vars.WINDOWS_SIGNING == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true

      - name: Install zstd
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstandard -y --no-progress
          }

      - name: Unpack CLI dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          zstd -d --stdout "$env:RUNNER_TEMP\kilo-cli.tar.zst" | tar -xf - -C dist

      - name: Az login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries with EV certificate
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool
          export PATH="$USERPROFILE/.dotnet/tools:$PATH"
          # AzureSignTool requires an explicit auth option (-kva/-kvi/-kvm; there is no
          # DefaultAzureCredential fallback). Mint a Key Vault token from the azure/login
          # OIDC session and pass it via -kva.
          token="$(az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)"
          for exe in dist/@tucode/cli-windows-*/bin/tucode.exe; do
            AzureSignTool sign -v \
              -kvu "${{ secrets.AZURE_KEY_VAULT_URI }}" \
              -kvc "${{ secrets.AZURE_CERT_NAME }}" \
              -kva "$token" \
              -tr http://timestamp.digicert.com \
              -d "tucode CLI" \
              "$exe"
          done

      - name: Verify signatures
        shell: pwsh
        run: |
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $signtool = Join-Path $kit.FullName "x64\signtool.exe"
          foreach ($exe in Get-ChildItem "dist\@tucode\cli-windows-*\bin\tucode.exe") {
            & $signtool verify /pa $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Only the signed exes leave the Windows runner. Repacking the whole dist
      # here would drop POSIX executable bits from the extensionless Unix
      # binaries (Windows tar has no modes to preserve); pack-signed-cli merges
      # this overlay into the original Linux-produced tarball instead.
      - name: Pack signed Windows binaries
        shell: bash
        run: |
          cd dist
          # --force-local: git-bash tar reads $RUNNER_TEMP's "D:\..." colon as an
          # rmt remote-tape "host:path" and dies with "Cannot connect to D".
          tar --zstd --force-local -cf "$RUNNER_TEMP/kilo-windows-signed.tar.zst" ./@tucode/cli-windows-*/bin/tucode.exe

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/kilo-windows-signed.tar.zst
          archive: false

      # build-cli already uploaded unsigned Windows zips to the draft release;
      # replace them with signed copies so release assets match what npm/VSIX ship.
      # One asset per invocation with retries, for the same reason build-cli uploads
      # that way: a dropped connection can commit the asset anyway, and the retry
      # inside gh then dies on "ReleaseAsset.name already exists". --clobber clears
      # that asset at the start of the next attempt.
      - name: Re-upload signed Windows release zips
        shell: pwsh
        run: |
          $archives = @()
          foreach ($dir in Get-ChildItem "dist\@tucode\cli-windows-*" -Directory) {
            $archive = "tucode-" + $dir.Name.Replace("cli-", "") + ".zip"
            Compress-Archive -Path (Join-Path $dir.FullName "bin\*") -DestinationPath $archive -Force
            $archives += $archive
          }
          foreach ($archive in $archives) {
            foreach ($attempt in 1..4) {
              gh release upload "v${{ needs.build-cli.outputs.version }}" $archive --clobber
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw "Could not upload $archive after 4 attempts" }
              Write-Host "upload: $archive failed (attempt $attempt/4), retrying in 10s"
              Start-Sleep -Seconds 10
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Overlay the signed Windows exes onto the original Linux-produced dist
  # tarball so POSIX mode bits on the Unix binaries (kilo, bwrap) stay intact.
  # When signing is off, the dist passes through unchanged under the same name.
  pack-signed-cli:
    name: Pack signed CLI dist
    needs:
      - build-cli
      - sign-cli-windows
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.sign-cli-windows.result) }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - uses: actions/download-artifact@v8
        if: needs.sign-cli-windows.result == 'success'
        with:
          name: kilo-windows-signed.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Merge signed binaries and repack
        run: |
          mkdir -p dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C dist
          if [ -f /tmp/kilo-windows-signed.tar.zst ]; then
            tar --zstd -xf /tmp/kilo-windows-signed.tar.zst -C dist
          fi
          tar --zstd -cf "$RUNNER_TEMP/kilo-cli-signed.tar.zst" -C dist .

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/kilo-cli-signed.tar.zst
          archive: false
  # kilocode_change end

  build-vscode:
    needs:
      - build-cli
      - pack-signed-cli # kilocode_change
      - validate-cli-unix
      - validate-cli-windows
    runs-on: ubuntu-24.04 # kilocode_change - fork: GitHub-hosted runners; this fork cannot use Kilo's Blacksmith runners
    if: ${{ !cancelled() && needs.validate-cli-unix.result == 'success' && needs.validate-cli-windows.result == 'success' }} # kilocode_change - fork: with or without Windows signing
    steps:
      - uses: actions/checkout@v6 # kilocode_change

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-sbom # kilocode_change - VSIX sidecars scan the packaged archive

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      # kilocode_change start - download into /tmp and extract the tar.zst packed by build-cli,
      # then apply changesets so the packaged VSIX ships the current changelog
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli-signed.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli-signed.tar.zst -C packages/opencode/dist

      - name: Apply changesets to changelog
        run: bun script/kilocode/changeset-version.ts
        env:
          KILO_VERSION: ${{ needs.build-cli.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
      # kilocode_change end
      - name: Build VSIX packages
        run: bun script/build.ts
        working-directory: ./packages/kilo-vscode
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist
          KILO_VERSION: ${{ needs.build-cli.outputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}
          SBOM_ENFORCE: ${{ vars.SBOM_ENFORCE }} # kilocode_change

      - uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

  # kilocode_change start
  # Run smoke tests against CLI assets uploaded to the draft GitHub release
  # before publishing the release and package artifacts.
  smoke-test:
    name: Smoke Test (pre-publish gate)
    needs:
      - version
      - build-cli
      - sign-cli-windows
    # fork: this runs Kilo's private benchmark through Kilo Gateway, so the fork's release goes
    # without it. validate-cli-unix and validate-cli-windows still run every built binary.
    if: false
    uses: ./.github/workflows/smoke-test.yml
    with:
      cli_version: ${{ needs.version.outputs.version }}
    secrets: inherit
  # kilocode_change end

  publish:
    needs:
      - version
      - build-cli
      - build-vscode
      - pack-signed-cli # kilocode_change
      - validate-cli-unix # kilocode_change
      - validate-cli-windows # kilocode_change
      - smoke-test
    if: ${{ !cancelled() && needs.build-vscode.result == 'success' }} # kilocode_change - fork: without Windows signing and Kilo's smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        # kilocode_change start
        with:
          persist-credentials: false
        # kilocode_change end

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-sbom # kilocode_change - npm and OCI sidecars scan the published bytes

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # kilocode_change

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # kilocode_change start
          kilo-maintainer-app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          kilo-maintainer-app-secret: ${{ secrets.KILO_MAINTAINER_APP_SECRET }}
          # kilocode_change end

      # kilocode_change start - download into /tmp and extract the tar.zst packed by build-cli
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli-signed.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli-signed.tar.zst -C packages/opencode/dist
      # kilocode_change end
      - uses: actions/download-artifact@v8
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

      - name: Cache apt packages (AUR)
        if: false # kilocode_change - fork: the AUR package is Kilo's, and script/publish.ts only updates it there
        uses: actions/cache@v5 # kilocode_change
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        if: false # kilocode_change - fork: the AUR package is Kilo's, and script/publish.ts only updates it there
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "kilo-maintainer[bot]@users.noreply.github.com"
          git config --global user.name "kilo-maintainer[bot]"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }} # kilocode_change - fork: npm accepts provenance only from a public repository
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OPENVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          SBOM_ENFORCE: ${{ vars.SBOM_ENFORCE }} # kilocode_change
          # kilocode_change start - fork: npm publishes with a token, or through trusted publishing once
          # the packages exist; without either, the release skips npm (script/kilocode/channels.ts)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          # kilocode_change end
