{{- if and .Values.podDisruptionBudget.enabled (include "organization-server.external" .) (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "organization-server.fullname" . }}
  labels:
    {{- include "organization-server.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "organization-server.selectorLabels" . | nindent 6 }}
{{- end }}
