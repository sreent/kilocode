{{- if include "organization-server.secret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "organization-server.fullname" . }}
  labels:
    {{- include "organization-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.secret.value (not .Values.secret.existingSecret) }}
  ORGANIZATION_SECRET: {{ .Values.secret.value | quote }}
  {{- end }}
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  ORGANIZATION_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.bootstrap.token (not .Values.bootstrap.existingSecret) }}
  ORGANIZATION_BOOTSTRAP_TOKEN: {{ .Values.bootstrap.token | quote }}
  {{- end }}
{{- end }}
