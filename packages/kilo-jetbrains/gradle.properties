kotlin.stdlib.default.dependency=false
kilo.jetbrains.version=7.1.12
# When false (the default) the plugin builds against the CLI in this repository: its API client comes
# from the SDK's committed OpenAPI spec, and it bundles the CLI that :backend:buildRepoCli builds.
# When true it uses the pinned CLI release from package.json, downloaded from the GitHub releases of
# the repository in brand/brand.json. false is NOT releasable: production builds need true, so
# publish the CLI release first.
kilo.cli.pinned=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.jetbrains.intellij.platform.useCacheRedirector=false
